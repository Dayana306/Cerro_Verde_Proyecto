spring.application.name=cerro-verde
server.port=8080

# PostgreSQL: crear previamente la base de datos cerro_verde
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cerro_verde}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# Para desarrollo del laboratorio: crea/actualiza tablas desde las entidades JPA.
# En producción se recomienda usar migraciones (Flyway/Liquibase) y validate.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.serialization.write-dates-as-timestamps=false
